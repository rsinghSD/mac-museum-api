spring:
  application:
    name: mac-museum-api
  datasource:
    url: jdbc:h2:mem:macmuseum;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json

app:
  version: '@project.version@'
  security:
    # Set WRITE_API_KEY to require an X-API-Key header on POST/PUT/DELETE.
    write-api-key: ${WRITE_API_KEY:}
    # Without a key, writes stay open for local development. The prod profile turns this off.
    allow-unauthenticated-writes: true
