# Render Blueprint: one Docker web service + one PostgreSQL database, both on the free plan.
# Deploy: Render Dashboard → New → Blueprint → select this repository.
# See docs/deployment.md for details and free-tier caveats.
services:
  - type: web
    name: mac-museum-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Random secret generated by Render; copy it from the Environment tab to make write calls.
      - key: WRITE_API_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: mac-museum-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mac-museum-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: mac-museum-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mac-museum-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mac-museum-db
          property: password

databases:
  - name: mac-museum-db
    plan: free
    databaseName: macmuseum
    user: macmuseum
    postgresMajorVersion: "16"
