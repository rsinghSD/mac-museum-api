name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. curl -i http://localhost:8080/api/v1/models?fromYear=2000&toYear=1990
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Response / logs
      render: shell
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0 or a1b2c3d
