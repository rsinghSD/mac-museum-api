name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Includes PostgresProfileIT, which uses Testcontainers and the runner's Docker.
      - name: Build and verify
        run: mvn -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mac-museum-api:ci .

      - name: Start container with PostgreSQL and wait until healthy
        run: |
          docker network create museum
          docker run -d --name db --network museum \
            -e POSTGRES_DB=macmuseum -e POSTGRES_USER=macmuseum -e POSTGRES_PASSWORD=ci \
            postgres:16-alpine
          docker run -d --name app --network museum -p 8080:8080 \
            -e DB_HOST=db -e DB_NAME=macmuseum -e DB_USER=macmuseum -e DB_PASSWORD=ci \
            -e WRITE_API_KEY=ci-key \
            mac-museum-api:ci
          for i in $(seq 40); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 5
          done
          docker logs app | tail -20
          [ "$status" = healthy ]

      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS "http://localhost:8080/api/v1/models?size=1"
          curl -fsS -o /dev/null http://localhost:8080/
          # Writes need the API key.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE http://localhost:8080/api/v1/models/imac-g3)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H 'X-API-Key: ci-key' http://localhost:8080/api/v1/models/imac-g3)" = 204
